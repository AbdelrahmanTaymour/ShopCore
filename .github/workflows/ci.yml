name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: shopcore
          POSTGRES_PASSWORD: shopcore
          POSTGRES_DB: shopcore_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      - name: Enable pgvector extension
        run: |
          PGPASSWORD=shopcore psql -h localhost -U shopcore -d shopcore_test -c "CREATE EXTENSION IF NOT EXISTS vector;"

      - name: Run migrations
        working-directory: apps/api
        run: pnpm exec prisma migrate deploy
        env:
          DATABASE_URL: postgresql://shopcore:shopcore@localhost:5432/shopcore_test

      - name: Run tests
        working-directory: apps/api
        run: pnpm test
        env:
          DATABASE_URL: postgresql://shopcore:shopcore@localhost:5432/shopcore_test
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: test-secret-min-10-chars
          WEBHOOK_SIGNING_SECRET: test-secret-min-10-chars

      - name: Build
        working-directory: apps/api
        run: pnpm build

      - name: Build Docker image
        run: docker build -f apps/api/Dockerfile -t shopcore-api:ci .
